name: Website Monitoring

on:
  schedule:
    - cron: '0 * * * *'  # This schedules the job to run every hour at the start of the hour
  workflow_dispatch:  # Allows you to trigger manually if needed

jobs:
  monitor-website:
    runs-on: ubuntu-latest  # The action will run on an Ubuntu runner

    steps:
      # Step 1: Checkout the repository
      - name: Checkout Repository
        uses: actions/checkout@v3

      # Step 2: Set up Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      # Step 3: Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # Step 4: Monitor Website
      - name: Monitor Website
        run: |
          python website_monitor.py || echo "Error occurred during website monitoring"  # Log error if it fails
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}

      # Optional: Step to log errors (optional if you want more debugging)
      - name: Capture logs
        run: |
          echo "Checking logs..."
          tail -n 100 /var/log/syslog  # Capture the last 100 lines of system logs (helpful for troubleshooting)
