name: Website Monitoring

on:
  schedule:
    - cron: '*/1 * * * *'  # This schedules the job to run every 1 minute
  workflow_dispatch:  # Allows you to manually trigger the workflow if needed

jobs:
  monitor-website:
    runs-on: ubuntu-latest  # The action will run on an Ubuntu runner

    steps:
      # Step 1: Checkout the repository
      - name: Checkout Repository
        uses: actions/checkout@v3

      # Step 2: Set up Python environment
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'  # Specify the version of Python you want to use

      # Step 3: Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip  # Upgrade pip to the latest version
          pip install requests  # Install the required requests package

      # Step 4: Run Website Monitoring Script
      - name: Monitor Website
        run: |
          python website_monitor.py || echo "Error occurred during website monitoring"  # Log error message if script fails
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}  # Store sensitive SMTP details securely in GitHub Secrets
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}

      # Optional: Step to capture logs for troubleshooting (not mandatory)
      - name: Capture logs
        run: |
          echo "Checking logs..."
          tail -n 100 /var/log/syslog  # Capture the last 100 lines of system logs (helpful for troubleshooting)
